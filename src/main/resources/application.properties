spring.application.name=backendpetsalud

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petsalud_db?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.error.include-stacktrace=never
server.error.include-message=never

app.security.admin.email=${ADMIN_EMAIL:admin@petsalud.cl}
app.security.admin.password=${ADMIN_PASSWORD:Admin.PetSalud2026}
app.security.max-intentos=5
app.security.minutos-bloqueo=15
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.file.name=logs/petsalud.log
logging.level.AUDITORIA=INFO